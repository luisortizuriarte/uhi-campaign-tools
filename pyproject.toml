[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-uhi"
version = "1.0.0"
description = "Northern Virginia Urban Heat Island & Tree Canopy scientific analysis library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Virginia Climate Center & FACS" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pyproj>=3.5",
    "pyogrio>=0.7",
    "xarray>=2023.0",
    "libpysal>=4.8",
    "esda>=2.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["uhi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
